name: Book Store Pipeline

on:
    push:
        branches:
              - main

jobs:
     build:
        
          runs-on: ubuntu-latest

          steps:
             - name: check repository
               uses: actions/checkout@v4

             - name: build image 
               run: docker build -t ${{secrets.DOCKER_USERNAME}}/online-book-store:${{github.sha}} . 

             - name: login to docker hub
               uses: docker/login-action@v3 
               with:
                 username: ${{secrets.DOCKER_USERNAME}}
                 password: ${{secrets.DOCKER_PASSWORD}}
             
             - name: push image to hub
               run: docker push ${{secrets.DOCKER_USERNAME}}/online-book-store:${{github.sha}} 
    
     deploy:
          
          needs: build
          runs-on: self-hosted

          steps:
             - name: check repository
               uses: actions/checkout@v4

             - name: check kubernetes
               run: kubectl get nodes

             - name: deploy to kubernetes
               run: kubectl apply -f kubernetes/

             - name: update kubernetes image
               run: kubectl set image deployment/bookstore-deployment \
                    bookstore=${{secrets.DOCKER_USERNAME}}/online-book-store:${{github.sha}} \
                    -n bookstore
                
             - name: check deployment
               run: kubectl rollout deployment/bookstore-deployment -n bookstore    

             - name: check nodes status
               run: kubectl get pods -n bookstore
                   
                   