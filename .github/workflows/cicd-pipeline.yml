name: Book Store Pipeline

on:
    push:
        branches:
              - main

jobs:
     build:
        
          runs-on: ubuntu-latest

          steps:
             - name: check repository
               uses: actions/checkout@v4

             - name: build image 
               run: docker build -t ${{secrets.DOCKER_USERNAME}}/online-book-store:${{github.sha}} . 

             - name: login to docker hub
               uses: docker/login-action@v3 
               with:
                 username: ${{secrets.DOCKER_USERNAME}}
                 password: ${{secrets.DOCKER_PASSWORD}}
             
             - name: push image to hub
               run: docker push ${{secrets.DOCKER_USERNAME}}/online-book-store:${{github.sha}} 
              