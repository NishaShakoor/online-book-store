<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book - Online Book Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>✏️ Edit Book</h1>

        <form action="{{ url_for('edit_book', book_id=book.id) }}"
              method="POST"
              class="book-form">

            <label for="title">Book Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ book.title }}"
                required
            >

            <label for="author">Author</label>
            <input
                type="text"
                id="author"
                name="author"
                value="{{ book.author }}"
                required
            >

            <label for="price">Price</label>
            <input
                type="number"
                id="price"
                name="price"
                value="{{ book.price }}"
                step="0.01"
                min="0"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="5"
            >{{ book.description }}</textarea>

            <button type="submit">Update Book</button>

        </form>

        <a href="{{ url_for('index') }}" class="back-button">
            ← Back to Books
        </a>

    </div>

</body>
</html>
